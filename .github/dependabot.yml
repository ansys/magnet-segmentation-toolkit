version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Paris"
    # A dependency is placed in the FIRST group whose patterns match it,
    # so the catch-all "transitive" group must stay last.
    groups:
      runtime:
        applies-to: version-updates
        patterns:
          - "ansys-aedt-toolkits-common"
          - "pyinstaller"
      doc:
        applies-to: version-updates
        patterns:
          - "ansys-sphinx-theme"
          - "ipython"
          - "ipywidgets"
          - "jupyterlab"
          - "jupytext"
          - "nbsphinx"
          - "numpydoc"
          - "pypandoc"
          - "recommonmark"
          - "sphinx*" # Sphinx, sphinx-autobuild, sphinx-copybutton, sphinx_design
      tests:
        applies-to: version-updates
        patterns:
          - "pytest*" # pytest, pytest-cov, pytest-qt
      quality:
        applies-to: version-updates
        patterns:
          - "prek"
          - "ruff"
          - "ty"
      transitive:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
      include:
        - "*"  # Include all dependencies in cooldown
      exclude:
        - "ansys-*"
    assignees:
      - "gmalinve"
    labels:
      - "maintenance"
      - "dependencies"
    commit-message:
      prefix: "BUILD(uv)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Paris"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
      include:
        - "*"  # Include all dependencies in cooldown
      exclude:
        - "ansys/actions"
    assignees:
      - "gmalinve"
    labels:
      - "maintenance"
      - "dependencies"
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "astral-sh/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "codecov/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "micnncim/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "peter-evans/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pypa/*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: "BUILD(actions)"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Paris"
    groups:
      precommit:
        applies-to: version-updates
        patterns:
          - "*"
      precommit-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7 # Fallback cooldown if no specific rule applies
      include:
        - "*"  # Include all dependencies in cooldown
      exclude:
        - "ansys/pre-commit-hooks"
    assignees:
      - "gmalinve"
    labels:
      - "maintenance"
      - "dependencies"
    commit-message:
      prefix: "BUILD(pre-commit)"
